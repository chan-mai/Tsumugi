name: Version Check

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Verify API_VERSION matches package version
        run: |
          pkg="$(node -p "require('./packages/tsumugi/package.json').version")"
          api="$(node -p "require('fs').readFileSync('packages/tsumugi/src/api/openapi.ts','utf8').match(/API_VERSION = '([^']+)'/)[1]")"
          if [ "$api" != "$pkg" ]; then
            echo "::error::API_VERSION $api does not match package version $pkg"
            exit 1
          fi
          echo "version $pkg"

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./packages/tsumugi/package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package version $pkg"
            exit 1
          fi
